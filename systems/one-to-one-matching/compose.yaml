services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: matching
      POSTGRES_PASSWORD: matching
      POSTGRES_DB: matching
    ports:
      - "5432:5432"
    volumes:
      - matching-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U matching -d matching
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  matching-postgres-data: